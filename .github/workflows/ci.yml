name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Repete as respostas gravadas (sem rede nem chave) e reprova se a qualidade cair.
      - run: npm run eval -- --no-write --min-correct 0.75 --max-silent-wrong 0.10
